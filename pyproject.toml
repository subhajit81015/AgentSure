[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsure"
version = "0.1.0"
description = "Enterprise Agentic AI Evaluation and Assurance Platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp>=1.36,<2",
  "python-json-logger>=3,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2"
]
kafka = [
  "aiokafka>=0.12,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]
[tool.pytest.ini_options]
pythonpath = ["src"]

